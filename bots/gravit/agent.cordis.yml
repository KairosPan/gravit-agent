  name: ../../face/plugins/gravit.js
  config:
    roles:
      - tool: role_cn_market_analyst
        summary: Reads one frozen cn-market run's environment, sentiment and theme contexts, in that order, or the one module the brief names, and submits each module's validated artifact through its submit tool.
      - tool: role_cn_reviewer
