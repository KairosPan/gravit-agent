# The isolated run: the face, the Account and the market as three boxes (docs/superpowers/specs/
# 2026-10-27-account-in-repo-design.md §5, §7; 2026-11-03-account-split-and-identity-design.md
# §4). The host dev loop — host processes — stays the default; this file is started on purpose.
# Run `docker compose` at the repo root: the agent box mounts an allowlist of the repo's paths
# (sources relative to this file's directory) under `${PWD}`, the shell's directory, so the tree
# lands in the box at the repo's own host path (dsh records absolute paths). Stop the host face
# first: the agent box publishes 3090 on the host's loopback. The account box publishes nothing:
# only the agent box reaches it, at account:4820 on the gravit network. The market box publishes
# nothing either: the account box reads it at market:4821, and the agent box reaches it there too,
# for the Markets screens (the face's /data/market proxy) and the mcp-market row (Gravit's
# market_* tools). Stopping the host Account and market too is advised (one of each in sight),
# not required.
#
# The market box runs AKShare and holds the iFinD token; the account box holds neither; the agent
# box runs no data source.
#
# The agent box mounts no docker socket and no path of the Account's home: Gravit's shell sees
# the allowlisted paths and the box's volumes, no other host file (on Docker Desktop
# host.docker.internal still reaches the Mac's loopback services, as the host dev loop does).

services:
  market:
    build: ./market
    command: ["npm", "run", "market"]
    environment:
      # For the box only: the Host fence is the DNS-rebinding defence, not authentication.
      MARKET_BIND: "0.0.0.0"
      MARKET_HOSTS: "market:4821"
    # The iFinD token is the market's alone (POST /api/cn/ifind, Lunhui's reach); the account box
    # and the agent box never read it.
    env_file:
      - path: .env.ifind
        required: false
    expose: ["4821"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4821/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 12
      start_period: 20s
    networks: [gravit]

  account:
    build: ./account
    command: ["npm", "run", "account", "--", "--home", "/data"]
    environment:
      # For the box only: the Host fence is the DNS-rebinding defence, not authentication.
      PORTFOLIO_BIND: "0.0.0.0"
      PORTFOLIO_HOSTS: "account:4820"
      PORTFOLIO_MARKET_URL: "http://market:4821"
    expose: ["4820"]
    volumes: ["account-home:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4820/api/overview').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 12
      start_period: 20s
    depends_on:
      market:
        condition: service_healthy
    networks: [gravit]

  agent:
    build: ./face
    working_dir: ${PWD}/face
    # An allowlist of the tree, never the root: the root holds .env* files (a venue's keys among
    # them) and GRAVIT.local.md, none of which enter this box. account/ and market/ are read-only
    # (the boxes' build contexts, the seat's and the mcp-market row's code); their node_modules
    # are the volumes below.
    volumes:
      - ./face:${PWD}/face
      - ./strategies:${PWD}/strategies
      - ./bots:${PWD}/bots
      - ./roles:${PWD}/roles
      - ./account:${PWD}/account:ro
      - ./market:${PWD}/market:ro
      - ./dsh:${PWD}/dsh:ro
      - ./docs:${PWD}/docs:ro
      - ./GRAVIT.md:${PWD}/GRAVIT.md:ro
      - ./CLAUDE.md:${PWD}/CLAUDE.md:ro
      - ./AGENTS.md:${PWD}/AGENTS.md:ro
      - ./Gravit-Design.md:${PWD}/Gravit-Design.md:ro
      - ./DEVELOPMENT.md:${PWD}/DEVELOPMENT.md:ro
      - ./ROADMAP.md:${PWD}/ROADMAP.md:ro
      - dsh-home:/dsh-home
      - seat-home:/seat-home
      # Linux node_modules over the host's macOS ones; the entrypoint runs npm ci when empty.
      - face-modules:${PWD}/face/node_modules
      # Its mount point must exist in the read-only bind above: `cd account && npm ci` on the host first.
      - account-modules:${PWD}/account/node_modules
      # The same for market/: `cd market && npm ci` on the host first.
      - market-modules:${PWD}/market/node_modules
    # An empty, read-only .git at the repo's path: dsh's agent-instructions row finds the project
    # root by a .git marker (else it takes the session's cwd), so GRAVIT.md at the root reaches
    # every session; no history and no git config enter the box.
    tmpfs:
      - ${PWD}/.git:ro
    env_file:
      - path: .env.deepseek
        required: false
    environment:
      FACE_ACCOUNT_URL: "http://account:4820"
      FACE_MARKET_URL: "http://market:4821"
      BUYER_HOME: /seat-home
      DSH_HOME: /dsh-home
    ports: ["127.0.0.1:3090:3090"]
    depends_on:
      account:
        condition: service_healthy
      market:
        condition: service_healthy
    networks: [gravit]

networks:
  gravit: {}

volumes:
  dsh-home: {}
  seat-home: {}
  account-home: {}
  face-modules: {}
  account-modules: {}
  market-modules: {}
