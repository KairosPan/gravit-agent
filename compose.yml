# The isolated run: the face and the Account as two boxes (docs/superpowers/specs/
# 2026-10-27-account-in-repo-design.md §5, §7). The host dev loop — two host processes — stays
# the default; this file is started on purpose. Run `docker compose` at the repo root: the agent
# box mounts an allowlist of the repo's paths (sources relative to this file's directory) under
# `${PWD}`, the shell's directory, so the tree lands in the box at the repo's own host path (dsh
# records absolute paths). Stop the host face and Account first: both boxes publish 3090 and
# 4820 on the host's loopback.
#
# The agent box mounts no docker socket and no path of the Account's home: Gravit's shell sees
# the allowlisted paths and the box's volumes, no other host file (on Docker Desktop
# host.docker.internal still reaches the Mac's loopback services, as the host dev loop does).

services:
  account:
    build: ./account
    command: ["npm", "run", "account", "--", "--home", "/data"]
    environment:
      # For the box only: the Host fence is the DNS-rebinding defence, not authentication.
      PORTFOLIO_BIND: "0.0.0.0"
      PORTFOLIO_HOSTS: "account:4820"
    # The iFinD token is the Account's alone (POST /api/cn/ifind); the agent box never reads it.
    env_file:
      - path: .env.ifind
        required: false
    ports: ["127.0.0.1:4820:4820"]
    volumes: ["account-home:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4820/api/overview').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 12
      start_period: 20s
    networks: [gravit]

  agent:
    build: ./face
    working_dir: ${PWD}/face
    # An allowlist of the tree, never the root: the root holds .env* files (a venue's keys among
    # them) and GRAVIT.local.md, none of which enter this box. account/ is read-only (the
    # Account box's build context and the seat's code); its node_modules is the volume below.
    volumes:
      - ./face:${PWD}/face
      - ./strategies:${PWD}/strategies
      - ./bots:${PWD}/bots
      - ./roles:${PWD}/roles
      - ./account:${PWD}/account:ro
      - ./dsh:${PWD}/dsh:ro
      - ./docs:${PWD}/docs:ro
      - ./GRAVIT.md:${PWD}/GRAVIT.md:ro
      - ./CLAUDE.md:${PWD}/CLAUDE.md:ro
      - ./AGENTS.md:${PWD}/AGENTS.md:ro
      - ./Gravit-Design.md:${PWD}/Gravit-Design.md:ro
      - ./DEVELOPMENT.md:${PWD}/DEVELOPMENT.md:ro
      - ./ROADMAP.md:${PWD}/ROADMAP.md:ro
      - dsh-home:/dsh-home
      - seat-home:/seat-home
      # Linux node_modules over the host's macOS ones; the entrypoint runs npm ci when empty.
      - face-modules:${PWD}/face/node_modules
      # Its mount point must exist in the read-only bind above: `cd account && npm ci` on the host first.
      - account-modules:${PWD}/account/node_modules
    # An empty, read-only .git at the repo's path: dsh's agent-instructions row finds the project
    # root by a .git marker (else it takes the session's cwd), so GRAVIT.md at the root reaches
    # every session; no history and no git config enter the box.
    tmpfs:
      - ${PWD}/.git:ro
    env_file:
      - path: .env.deepseek
        required: false
    environment:
      FACE_BIND: "0.0.0.0"
      FACE_ACCOUNT_URL: "http://account:4820"
      BUYER_HOME: /seat-home
      DSH_HOME: /dsh-home
      FACE_AKSHARE_MCP_COMMAND: /usr/local/bin/akshare-mcp
    ports: ["127.0.0.1:3090:3090"]
    depends_on:
      account:
        condition: service_healthy
    networks: [gravit]

networks:
  gravit: {}

volumes:
  dsh-home: {}
  seat-home: {}
  account-home: {}
  face-modules: {}
  account-modules: {}
