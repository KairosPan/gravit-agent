# Gravit profile TEMPLATE - verify key names against current dsh docs before install.
#
# This file is the CONTENT of the operator's half of the profile (which skill roots to read,
# which model to run, what always needs approval), written in the indicative shape the plan
# used. It is not a validated dsh config: dsh is a developer preview and says so - "THERE WILL
# BE COMPATIBILITY-BREAKING CHANGES". Per the frozen 2026-08-22 survey
# (docs/research/2026-08-22-deepseek-harness-dsh-survey.md), a real cordis.yml is a LIST of
# plugin entries {id, name, config, disabled}, and a profile lives at
# $DSH_HOME/profiles/<name>/ (default $DSH_HOME=~/.dsh) with its own cordis.patch.yml. So at
# install time: translate each block below into the plugin row that owns it, in
# $DSH_HOME/profiles/face/cordis.patch.yml (the face rewrites that profile's cordis.yml on
# every boot).
#
# The MCP servers are NOT here: the face composes its own rows on every boot, and the
# operator's patch file overrides them by id. They are the host overlay (webserver,
# connection, the Remote controllers, the preset registry and Gravit's preset - rendered from
# roles/ and dsh/profile/cycle.md), the policy rows (face/src/policy.ts), the AKShare row
# `mcp-akshare` (face/src/akshare.ts) for public A-share queries, and the Account seat row
# `mcp-account` (face/src/account-seat.ts), the agent's only path to the operator's Account,
# paper venues only. The face's plugin panel (/data/plugins.json) shows what booted.
#
# <ABSOLUTE PATH TO THIS REPO> stays a placeholder here on purpose - it is filled in only in
# the installed copy under the harness home, never in the repo copy.

llm:
  provider: deepseek          # first-party llm-deepseek adapter; DEEPSEEK_API_KEY from env

skills:
  # Skill discovery expects <root>/<name>/SKILL.md, so the roots are the two GROUP dirs, not
  # their parent: pointing at dsh/skills alone would look for dsh/skills/mechanics/SKILL.md.
  # Installed as the `skill-filesystem` row's customSkillDirs.
  paths:
    - <ABSOLUTE PATH TO THIS REPO>/dsh/skills/mechanics
    - <ABSOLUTE PATH TO THIS REPO>/dsh/skills/style-gravit

# Gate 2 (per-order human approval) as INTENT, not as a validated key. The frozen survey has
# no profile-level per-TOOL always_ask: ApprovalPolicy is a per-SESSION two-value knob
# (ask | never, survey line 600), per-tool allow/deny/ask lives in the tools/pre-execute
# waterfall (line 621, a plugin seam rather than YAML), and MCP tools are registered under a
# serverName namespace (line 684), so bare tool names would not match even if a top-level block
# did bind. An unrecognised key merges SILENTLY - it fails open, quietly.
#
# REALIZED 2026-09-04, in code rather than in YAML: face/src/orders.ts registers a
# tools/pre-execute listener (the seam this comment predicted), matching on the RAW name suffix
# so the serverName namespace above cannot slip a renamed tool past. The two order tools named
# below left with the alpaca-kit server on 2026-10-24 (the gate now DENIES them under any
# server name); today the listener raises an approval card for every write of the Account
# seat. The block stays inert and stays here as the record of what did NOT work. The gate only
# binds inside `face`: a dsh tree composed WITHOUT the face has no per-write card, only the
# Account's own Guard card.
permissions:
  always_ask: [place_order, cancel_order]

workspace: <ABSOLUTE PATH TO THIS REPO>
